name: Deploy

# Deploys the dashboard to BOTH GitHub Pages and Cloudflare Pages during the
# migration. This is deliberate and temporary — see the ordering note below.
#
# Why two hosts at once:
#   proviso.finance currently resolves to GitHub Pages. Cloudflare Pages is new
#   and unproven, and the repository must stay public for GitHub Pages to serve
#   at all (the Free plan stops serving a private repo). Deploying only to
#   Cloudflare would mean that if its setup is incomplete, the job fails while
#   the live site quietly keeps serving the previous build — the worst outcome,
#   because it looks like nothing happened.
#
#   So GitHub Pages remains the source of truth until Cloudflare is verified,
#   and the Cloudflare step SKIPS cleanly when its secrets are absent rather
#   than failing the run.
#
# Migration order (see .claude/plans/cloudflare-migration-runbook.md):
#   1. Land this workflow with the repo still PUBLIC   → GitHub Pages updates
#   2. Create the Cloudflare Pages project + secrets   → Cloudflare step wakes up
#   3. Verify the *.pages.dev URL serves correctly
#   4. Repoint IONOS DNS to Cloudflare, verify proviso.finance
#   5. Delete the `pages` job below, THEN flip the repo private
#
# Flipping the repo private before step 4 takes the live site down.
#
# Optional repository secrets (absent = Cloudflare step skips):
#   CLOUDFLARE_API_TOKEN    token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID   from the Cloudflare dashboard URL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Build backend (the dashboard imports the interpreter from dist/)
        run: npm run build

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      # For the Cloudflare job, which does not re-run the build.
      - name: Upload dashboard build
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          retention-days: 1

      # For the GitHub Pages job.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist
          retention-days: 1

  # Remove this job once Cloudflare is verified and DNS has moved (step 5).
  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    # Job-level env so the value is visible to the step-level `if` below.
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Report skip
        if: env.CF_TOKEN == ''
        run: |
          echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping the Cloudflare deploy."
          echo "GitHub Pages remains the live site. See .claude/plans/cloudflare-migration-runbook.md"

      - name: Download dashboard build
        if: env.CF_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: dist

      - name: Deploy to Cloudflare Pages
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=proviso --branch=main
