<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ProViso product demo." />
  <meta name="theme-color" content="#0A1628" />

  <!-- Open Graph: makes the shared link unfurl nicely in email, Slack, LinkedIn, iMessage -->
  <meta property="og:title" content="ProViso — Product Demo" />
  <meta property="og:description" content="ProViso product demo." />
  <meta property="og:type" content="video.other" />
  <meta property="og:url" content="https://proviso.finance/demo/" />
  <meta property="og:image" content="https://proviso.finance/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ProViso — Product Demo" />
  <meta name="twitter:description" content="ProViso product demo." />
  <meta name="twitter:image" content="https://proviso.finance/og-image.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23B8860B' width='100' height='100' rx='12'/%3E%3Ctext x='50' y='68' text-anchor='middle' fill='%231a2744' font-family='Georgia' font-size='52' font-weight='600'%3EP%3C/text%3E%3C/svg%3E" />

  <title>ProViso — Product Demo</title>

  <!-- Plausible: same privacy-friendly analytics as the main site, so /demo visits show up in your dashboard -->
  <script defer data-domain="proviso.finance" src="https://plausible.io/js/script.js" onerror=""></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy-deep: #0A1628;
      --navy-card: #152238;
      --navy-border: #1E2F47;
      --gold: #D4AF37;
      --text-primary: #F9FAFB;
      --text-tertiary: #9CA3AF;
    }
    html, body { min-height: 100vh; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(212,175,55,0.06), transparent 60%),
        var(--navy-deep);
      color: var(--text-tertiary);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 32px;
      max-width: 1120px;
      margin: 0 auto;
      width: 100%;
    }
    .wordmark {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      text-decoration: none;
    }
    .wordmark .dot { color: var(--gold); }
    .nav-link {
      font-size: 14px;
      color: var(--text-tertiary);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .nav-link:hover { color: var(--gold); }

    /* ── Main ───────────────────────────────────── */
    main {
      flex: 1;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 32px 64px;
    }
    h1 {
      font-family: 'Crimson Pro', Georgia, serif;
      font-weight: 600;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      line-height: 1.12;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      text-align: center;
      margin: 0 auto 32px;
    }

    /* ── Video ──────────────────────────────────── */
    .video-frame {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
      background: var(--navy-card);
      border: 1px solid var(--navy-border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(212,175,55,0.06);
    }
    .video-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* ── Footer ─────────────────────────────────── */
    footer {
      text-align: center;
      padding: 32px;
      font-size: 13px;
      color: var(--text-tertiary);
      border-top: 1px solid var(--navy-border);
      max-width: 1120px;
      margin: 0 auto;
      width: 100%;
    }
    footer a { color: var(--text-tertiary); text-decoration: none; }
    footer a:hover { color: var(--gold); }

    @media (max-width: 640px) {
      header { padding: 20px; }
      main { padding: 16px 20px 48px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="wordmark" href="https://proviso.finance">ProViso<span class="dot">.</span></a>
    <a class="nav-link" href="https://proviso.finance">← Back to proviso.finance</a>
  </header>

  <main>
    <h1>Product Demo</h1>

    <div class="video-frame">
      <iframe
        src="https://www.youtube.com/embed/dRscoxYG73I?si=_9YMhRUXRoQtOmKR"
        title="ProViso Product Demo"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>
  </main>

  <footer>
    © 2026 ProViso · <a href="https://proviso.finance">proviso.finance</a>
  </footer>
</body>
</html>
